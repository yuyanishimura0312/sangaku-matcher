{% extends "base.html" %}
{% block title %}sangaku-matcher -- AI解析{% endblock %}
{% block content %}
<div class="hero-input">
    <h2>技術シーズをAI解析</h2>
    <p class="text-muted">技術の説明を入力するだけで、{{ company_count }}社のデータベースから連携候補をAIが提案します。</p>

    {% if error %}
    <div class="alert alert-danger" role="alert">
        <strong>エラー:</strong> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/match" id="match-form">
        <textarea class="form-control" id="description" name="description" rows="6"
                  placeholder="技術の概要を入力してください&#10;&#10;例: 酸化チタン系光触媒を用いて、可視光下で水中の有機汚染物質を分解する手法。従来手法と比較して触媒効率が3倍向上し、産業排水処理への応用が期待される。"
                  required minlength="10"
                  aria-label="技術シーズの説明"></textarea>
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" id="submit-btn">AI解析を実行</button>
    </form>
</div>

<script>
document.getElementById('match-form').addEventListener('submit', function() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.classList.add('btn-loading');
    btn.textContent = '解析中';
});
</script>
{% endblock %}
