<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sangaku-matcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">sangaku-matcher</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">新規入力</a>
                <a class="nav-link" href="/results">結果一覧</a>
                <a class="nav-link" href="/companies">企業一覧</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="container mt-5 mb-3 text-muted small">
        <hr>
        <p>sangaku-matcher v0.1 — 本結果はAIによる仮説であり、最終的な連携判断は専門家の評価に基づいて行ってください。</p>
    </footer>
</body>
</html>
