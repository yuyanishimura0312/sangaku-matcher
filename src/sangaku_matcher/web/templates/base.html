<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sangaku-matcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">本文へスキップ</a>
    <nav class="site-nav" aria-label="メインナビゲーション">
        <div class="container">
            <a class="brand" href="/">
                <div>
                    <div class="brand-name">sangaku-matcher</div>
                    <div class="brand-tag">Miratuku Lab</div>
                </div>
            </a>
            <button class="nav-toggle" aria-label="メニューを開閉" aria-expanded="false"
                    onclick="this.setAttribute('aria-expanded',this.getAttribute('aria-expanded')==='false'?'true':'false');this.nextElementSibling.classList.toggle('nav-open')">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" role="list">
                <li><a href="/" {% if request.url.path == "/" %}class="active" aria-current="page"{% endif %}>AI解析</a></li>
                <li><a href="/results" {% if request.url.path == "/results" %}class="active" aria-current="page"{% endif %}>結果一覧</a></li>
                <li><a href="/companies" {% if "/companies" in request.url.path and "/needs" not in request.url.path %}class="active" aria-current="page"{% endif %}>企業一覧</a></li>
                <li><a href="/needs" {% if "/needs" in request.url.path %}class="active" aria-current="page"{% endif %}>ニーズ一覧</a></li>
                <li><a href="/themes" {% if "/themes" in request.url.path %}class="active" aria-current="page"{% endif %}>テーマ体系</a></li>
            </ul>
        </div>
    </nav>
    <main id="main-content" class="main-container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer" role="contentinfo">
        <p>sangaku-matcher v0.1 by Miratuku Lab -- AIによるマッチング結果は仮説です。最終的な連携判断は専門家の評価を経て行ってください。</p>
    </footer>
</body>
</html>
