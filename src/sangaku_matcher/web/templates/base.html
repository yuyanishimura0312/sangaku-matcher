<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sangaku-matcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="site-nav">
        <div class="container">
            <a class="brand" href="/">
                <div>
                    <div class="brand-name">sangaku-matcher</div>
                    <div class="brand-tag">Miratuku Lab</div>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>シーズ入力</a></li>
                <li><a href="/results" {% if request.url.path == "/results" %}class="active"{% endif %}>結果一覧</a></li>
                <li><a href="/companies" {% if "/companies" in request.url.path %}class="active"{% endif %}>企業一覧</a></li>
            </ul>
        </div>
    </nav>
    <div class="main-container">
        {% block content %}{% endblock %}
    </div>
    <footer class="site-footer">
        <p>sangaku-matcher v0.1 by Miratuku Lab -- AI-assisted matching results are hypotheses; final collaboration decisions should be made with expert evaluation.</p>
    </footer>
</body>
</html>
