<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sangaku-matcher{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
    <meta name="view-transition" content="same-origin">
</head>
<body>
    <a class="skip-link" href="#main-content">本文へスキップ</a>
    <div class="ft-nav">
        <div class="ft-nav-inner">
            <div class="ft-nav-brand">
                <a href="https://yuyanishimura0312.github.io/foresight-tools/" class="ft-nav-suite">Foresight Tools</a>
                <div class="ft-nav-divider"></div>
                <span class="ft-nav-title">産学マッチャー</span>
            </div>
            <div class="ft-nav-links">
                <a href="https://yuyanishimura0312.github.io/structural-inflection-scorer/">Inflection Scorer</a>
                <a href="https://frontier-detector.onrender.com/">Frontier Detector</a>
            </div>
        </div>
    </div>
    <nav class="site-nav" aria-label="メインナビゲーション">
        <div class="container">
            <a class="brand" href="/">
                <div>
                    <div class="brand-name">sangaku-matcher</div>
                    <div class="brand-tag">Miratuku Lab</div>
                </div>
            </a>
            <button class="nav-toggle" aria-label="メニューを開閉" aria-expanded="false"
                    onclick="this.setAttribute('aria-expanded',this.getAttribute('aria-expanded')==='false'?'true':'false');this.nextElementSibling.classList.toggle('nav-open')">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" role="list">
                <li><a href="/" {% if request.url.path == "/" %}class="active" aria-current="page"{% endif %}>AI解析</a></li>
                <li><a href="/results" {% if request.url.path == "/results" %}class="active" aria-current="page"{% endif %}>結果一覧</a></li>
                <li><a href="/companies" {% if "/companies" in request.url.path and "/needs" not in request.url.path %}class="active" aria-current="page"{% endif %}>企業一覧</a></li>
                <li><a href="/needs" {% if "/needs" in request.url.path %}class="active" aria-current="page"{% endif %}>ニーズ一覧</a></li>
                <li><a href="/themes" {% if "/themes" in request.url.path %}class="active" aria-current="page"{% endif %}>テーマ体系</a></li>
                <li><a href="/guide" {% if "/guide" in request.url.path %}class="active" aria-current="page"{% endif %}>使い方</a></li>
                <li><a href="/database" {% if "/database" in request.url.path %}class="active" aria-current="page"{% endif %}>DB概要</a></li>
            </ul>
        </div>
    </nav>
    <main id="main-content" class="main-container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer" role="contentinfo">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="footer-brand-name">sangaku-matcher</span>
                <span class="footer-brand-version">v0.1</span>
            </div>
            <p>AIによるマッチング結果は仮説です。最終的な連携判断は専門家の評価を経て行ってください。</p>
            <div class="footer-links">
                <a href="/guide">使い方ガイド</a>
                <a href="/database">データベース概要</a>
                <a href="/themes">テーマ体系</a>
            </div>
            <p class="footer-credit">Miratuku Lab</p>
        </div>
    </footer>
    <script>
    (function(){
        /* Sticky nav shadow on scroll */
        var nav=document.querySelector('.site-nav');
        if(nav){
            var onScroll=function(){
                if(window.scrollY>8) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            };
            window.addEventListener('scroll',onScroll,{passive:true});
            onScroll();
        }
        /* Scroll-triggered fade-in */
        var els=document.querySelectorAll('.fade-in');
        if(els.length&&'IntersectionObserver' in window){
            var obs=new IntersectionObserver(function(entries){
                entries.forEach(function(e){
                    if(e.isIntersecting){
                        e.target.classList.add('visible');
                        obs.unobserve(e.target);
                    }
                });
            },{threshold:0.1,rootMargin:'0px 0px -40px 0px'});
            els.forEach(function(el){obs.observe(el);});
        } else {
            els.forEach(function(el){el.classList.add('visible');});
        }
        /* Auto-add fade-in to cards and guide elements */
        if('IntersectionObserver' in window){
            var revealObs=new IntersectionObserver(function(entries){
                entries.forEach(function(e){
                    if(e.isIntersecting){
                        e.target.classList.add('visible');
                        revealObs.unobserve(e.target);
                    }
                });
            },{threshold:0.08,rootMargin:'0px 0px -30px 0px'});
            document.querySelectorAll('.card,.guide-feature,.guide-step,.guide-tip,.guide-exit-card').forEach(function(el){
                if(!el.classList.contains('fade-in')){
                    el.classList.add('fade-in');
                    revealObs.observe(el);
                }
            });
        }
        /* Ripple effect on buttons */
        document.addEventListener('click',function(e){
            var btn=e.target.closest('.btn,.btn-primary,.btn-hero');
            if(!btn)return;
            var rect=btn.getBoundingClientRect();
            var size=Math.max(rect.width,rect.height);
            var x=e.clientX-rect.left-size/2;
            var y=e.clientY-rect.top-size/2;
            var ripple=document.createElement('span');
            ripple.className='ripple';
            ripple.style.cssText='width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend',function(){ripple.remove();});
        });
    })();
    </script>
</body>
</html>
